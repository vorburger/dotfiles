name: Debian 13 Trixie Codespace

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build Dockerfile-debian13_trixie-codespace
        run: docker build -f Dockerfile-debian13_trixie-codespace .
